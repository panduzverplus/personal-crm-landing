# Landing. CI uploads the built site (dist/) to /var/www/landing with rsync.
server {
    listen 80;
    listen [::]:80;
    server_name chigabugadaga.ru;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chigabugadaga.ru;

    include snippets/ssl-chigabugadaga.ru.conf;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
