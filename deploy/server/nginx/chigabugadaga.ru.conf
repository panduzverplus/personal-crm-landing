# Landing. CI uploads the built site (dist/) to /var/www/landing with rsync.
# Security headers are set here, in the server blocks of the landing only: other sites on this
# server (the app, the test app) keep their own settings.
server {
    listen 80;
    listen [::]:80;
    server_name chigabugadaga.ru;

    # Do not name the nginx version in the Server header or on error pages.
    server_tokens off;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chigabugadaga.ru;

    server_tokens off;

    include snippets/ssl-chigabugadaga.ru.conf;

    # Security headers. "always" adds them to error pages (404) too.
    # Do not add add_header inside a location: it would drop all the headers below for that location.
    # HSTS: one year, this domain only (no includeSubDomains: the app and test app share the domain).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP without nonce: the page has an inline <style> (font faces), so inline code is allowed.
    # Everything else (fonts, CSS, images) is only from this site. Links to the app are not limited by CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Forbid embedding in frames (X-Frame-Options is for old browsers, frame-ancestors above for the rest).
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
